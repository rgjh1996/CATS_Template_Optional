name: Build and test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify
        run: sh mvnw -B verify
  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: cats_test
          MYSQL_USER: cats_test
          MYSQL_PASSWORD: isolated-ci-password
          MYSQL_ROOT_PASSWORD: isolated-ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verify against MySQL
        env:
          CATS_TEST_DB_URL: jdbc:mysql://localhost:3306/cats_test
          CATS_TEST_DB_USER: cats_test
          CATS_TEST_DB_PASSWORD: isolated-ci-password
        run: sh mvnw -B verify
