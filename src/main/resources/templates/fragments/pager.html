<!doctype html><html xmlns:th="http://www.thymeleaf.org"><body><div th:fragment="pager" th:if="${page!=null}" class="actions pager"><a th:if="${page.hasPrevious()}" th:href="@{${pagePath}(page=${page.number - 1},size=${page.size},month=${month})}">Previous</a><span th:text="|Page ${page.number+1} of ${page.totalPages==0?1:page.totalPages} · ${page.totalElements} records|"></span><a th:if="${page.hasNext()}" th:href="@{${pagePath}(page=${page.number + 1},size=${page.size},month=${month})}">Next</a><form method="get" th:action="@{${pagePath}}"><input th:if="${month!=null}" type="hidden" name="month" th:value="${month}"><label>Rows per page<select name="size"><option th:each="n:${T(java.util.List).of(10,20,25)}" th:value="${n}" th:text="${n}" th:selected="${n==page.size}"></option></select></label><button>Apply</button></form></div></body></html>
