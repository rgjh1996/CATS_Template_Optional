spring.application.name=cats
spring.profiles.default=mysql
spring.jpa.open-in-view=false
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.timeout=30m
server.servlet.session.tracking-modes=cookie
cats.zone=Asia/Singapore

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=11MB
cats.mail.enabled=${CATS_MAIL_ENABLED:false}
cats.mail.from=${MAIL_FROM:cats@example.test}
cats.public-url=${CATS_PUBLIC_URL:http://localhost:8080}
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
